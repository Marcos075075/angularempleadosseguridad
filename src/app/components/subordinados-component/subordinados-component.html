<h1>Subordinados</h1>
@if (subordinados) {
<table class="table table-striped">
    <thead>
        <tr>
            <th>Apellido</th>
            <th>Oficio</th>
            <th>Salario</th>
            <th>Director</th>
        </tr>
    </thead>
    <tbody>
        @for(sub of subordinados; track sub){
            <tr>
                <td>{{sub.apellido}}</td>
                <td>{{sub.oficio}}</td>
                <td>{{sub.salario}}</td>
                <td>{{sub.director}}</td>
            </tr>
        }
    </tbody>
</table>
} @else {
    <h1> No se han encontrado subordinados para este usuario </h1>
}
