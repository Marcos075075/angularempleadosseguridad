<div style="text-align:center; margin:auto; width: 20%;">
    <h1>Login</h1>
    <form (ngSubmit)="login()">
        <label>Nombre de usuario: </label>
        <input type="text" name="cajauser" #cajauser class="form-control" required>
        <label>Contraseña: </label>
        <input type="password" name="cajapass" #cajapass class="form-control" required>
        <br>
        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
    </form>
</div>
